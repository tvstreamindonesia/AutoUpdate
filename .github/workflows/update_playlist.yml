name: Update Xoilac and LiveSports808 M3U8 Playlist

on:
  schedule:
    # Run automatically every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI
  push:
    branches:
      - main
    paths-ignore:
      - '**.m3u'
      - 'README.md'

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install puppeteer --no-audit --no-fund

      - name: Scrape LiveSports808 (Football & Badminton via Chrome DevTools)
        run: |
          node scraper_livesport.js || echo "LiveSports808 scraping completed or skipped"

      - name: Scrape Xoilac & Generate Master Playlist
        run: |
          python main.py

      - name: Commit and Push Updated Playlists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add xoilac.m3u livesports.m3u custom_channels.m3u package.json package-lock.json scraper_livesport.js generator.py config.py || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update xoilac.m3u and livesports.m3u [skip ci]" && git push)
